<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Bukti Pendaftaran LDK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="section">
    <div class="form-container" id="printableProof">
      <div style="text-align:center;" class="no-print">
        <h2>🎉 PENDAFTARAN BERHASIL!</h2>
        <p>Terima kasih data Anda sudah tersimpan resmi.</p>
        <br>
      </div>
      
      <div class="card">
        <h3 style="text-align: center; color: var(--primary);">BUKTI PENDAFTARAN LDK 2026–2027</h3>
        <hr style="margin: 15px 0;">
        <p><strong>Nomor Pendaftaran:</strong> <span id="resNo" style="color:var(--primary); font-weight:bold;">-</span></p>
        <p><strong>Nama Lengkap:</strong> <span id="resName">-</span></p>
        <p><strong>Kelas:</strong> <span id="resClass">-</span></p>
        <p><strong>Tanggal Daftar:</strong> <span id="resDate">-</span></p>
      </div>

      <br>
      <div class="no-print" style="text-align: center; display:flex; gap:10px; justify-content:center;">
        <button onclick="window.print()" class="btn btn-primary">CETAK BUKTI PENDAFTARAN</button>
        <a href="index.html" class="btn btn-secondary">KEMBALI KE UTAMA</a>
      </div>
    </div>
  </div>

  <script>
    const data = JSON.parse(sessionStorage.getItem("ldkRegSuccess") || "{}");
    if(data.registrationNumber) {
      document.getElementById("resNo").innerText = data.registrationNumber;
      document.getElementById("resName").innerText = data.fullName;
      document.getElementById("resClass").innerText = data.class;
      document.getElementById("resDate").innerText = new Date(data.registrationDate).toLocaleDateString("id-ID");
    }
  </script>
</body>
</html>
