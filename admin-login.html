<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Admin LDK</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="section">
    <div class="form-container" style="max-width: 400px;">
      <h2 style="text-align:center; color: var(--primary); margin-bottom: 20px;">Login Admin</h2>
      <form id="adminLoginForm">
        <div class="form-group">
          <label>Email Admin</label>
          <input type="email" id="adminEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">MASUK DASHBOARD</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
