<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin LDK</title>
  <link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo-brand">ADMIN LDK SMP CITRA BANGSA</div>
    <div>
      <button id="btnLogout" class="btn btn-danger btn-sm">LOGOUT</button>
    </div>
  </nav>

  <div class="section" style="max-width: 1200px;">
    
    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card"><h3>TOTAL</h3><div class="stat-number" id="stTotal">0</div></div>
      <div class="stat-card"><h3>KELAS VII</h3><div class="stat-number" id="st7">0</div></div>
      <div class="stat-card"><h3>KELAS VIII</h3><div class="stat-number" id="st8">0</div></div>
      <div class="stat-card"><h3>KELAS IX</h3><div class="stat-number" id="st9">0</div></div>
      <div class="stat-card"><h3>LAKI-LAKI</h3><div class="stat-number" id="stL">0</div></div>
      <div class="stat-card"><h3>PEREMPUAN</h3><div class="stat-number" id="stP">0</div></div>
    </div>

    <!-- FILTER & SEARCH -->
    <div class="card" style="margin-bottom: 20px;">
      <div style="display:flex; gap:15px; flex-wrap:wrap;">
        <input type="text" id="searchBox" class="form-control" placeholder="Cari Nama / No Reg..." style="flex:2; min-width: 200px;">
        <select id="filterClass" class="form-control" style="flex:1;">
          <option value="">Semua Kelas</option>
          <option value="VII">VII</option>
          <option value="VIII">VIII</option>
          <option value="IX">IX</option>
        </select>
        <select id="filterGender" class="form-control" style="flex:1;">
          <option value="">Semua Gender</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
        <select id="filterStatus" class="form-control" style="flex:1;">
          <option value="">Semua Status</option>
          <option value="Terdaftar">Terdaftar</option>
          <option value="Diverifikasi">Diverifikasi</option>
          <option value="Dibatalkan">Dibatalkan</option>
        </select>
        <button id="btnExport" class="btn btn-primary btn-sm">EXPORT EXCEL</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>No Reg</th>
            <th>Nama Lengkap</th>
            <th>L/P</th>
            <th>Kelas</th>
            <th>WA Siswa</th>
            <th>Ortu</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="adminTableBody">
          <!-- Data Firestore -->
        </tbody>
      </table>
    </div>

  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
